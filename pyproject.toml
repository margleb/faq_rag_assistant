[project]
name = "faq-rag-assistant"
version = "0.1.0"
description = "FAQ RAG Assistant with tool calling and semantic search"
readme = "README.md"
authors = [
    { name = "margleb", email = "margleb.dm@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "torch",
    "uvicorn>=0.53.0",
]

[project.scripts]
faq-rag-assistant = "faq_rag_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F — pyflakes и pycodestyle, I — сортировка импортов, UP — современный синтаксис,
# B — типичные ловушки, SIM — упрощения.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
