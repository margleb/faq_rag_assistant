services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY не задан, см. .env.example}
    volumes:
      # Кеш HuggingFace переживает пересоздание контейнера: модель не качается на каждом старте.
      - hf_cache:/home/app/.cache/huggingface
    # Контейнер считается готовым только когда uvicorn реально отвечает
    # (то есть после загрузки embedding-модели, а она занимает минуты на холодном кеше).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  # Одноразовая индексация FAQ: docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["tools"]
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    command: ["python", "-m", "faq_rag_assistant.rag.ingest"]
    depends_on:
      qdrant:
        condition: service_started

volumes:
  hf_cache:
