services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      # Кеш HuggingFace переживает пересоздание контейнера: модель не качается на каждом старте.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  hf_cache:
